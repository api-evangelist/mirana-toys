aid: mirana-toys
name: Mirana Toys
description: 'Mirana Toys (Mirana Innovations Pvt Ltd) is an India-based smart-toy company and OEM/ODM
  manufacturer of electronic toys — RC cars, monster trucks, drones, educational toys, and AI/AR toys.
  It pairs its consumer products with the Mirana smart app (iOS and Android), a mobile gaming platform
  that lets kids and adults control and play with Mirana toys over Bluetooth. As an OEM partner it offers
  in-house PCB/PCBA design and SMT assembly, tooling and mold design, mobile app development, compliance
  support (ASTM, EN-71, RoHS, ISO, SMETA), and global logistics for toy brands and retailers. Backed by
  Accel. The company publishes a consumer e-commerce storefront and support center but no public API or
  developer platform.'
